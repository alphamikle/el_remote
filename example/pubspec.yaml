name: example
description: "Easiest Remote Localization Example"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  easiest_localization: ^2.0.1
  easiest_remote_localization:
    path: ../
  localization:
    path: ./localization
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/i18n/

easiest_localization:
  excluded:
    - uk_UA
  save_merged_files_as: yaml